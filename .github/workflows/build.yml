name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache pub-cache
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Check signing secrets
        id: key_check
        env:
          KEY_JKS_PROBE: ${{ secrets.KEY_JKS }}
        run: |
          if [ -n "$KEY_JKS_PROBE" ]; then
            echo "HAS_KEY=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_KEY=false" >> $GITHUB_OUTPUT
            echo "::notice::KEY_JKS not configured — APK will be debug-signed."
          fi

      - name: Decode keystore
        if: steps.key_check.outputs.HAS_KEY == 'true'
        env:
          KEY_JKS_B64: ${{ secrets.KEY_JKS }}
          KEY_JKS_PASSPHRASE: ${{ secrets.KEY_JKS_PASSPHRASE }}
        run: |
          echo "$KEY_JKS_B64" > release.keystore.asc
          gpg -d --passphrase "$KEY_JKS_PASSPHRASE" --batch release.keystore.asc > $AVES_STORE_FILE
          rm release.keystore.asc
        # $AVES_STORE_FILE is expected by build.gradle.kts from env

      - name: Flutter version
        run: ./flutterw --version

      - name: Prepare play flavor
        run: scripts/gen_flavor_play.sh

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Build APK (signed release)
        if: steps.key_check.outputs.HAS_KEY == 'true'
        env:
          AVES_STORE_FILE: ${{ secrets.AVES_STORE_FILE }}
          AVES_STORE_PASSWORD: ${{ secrets.AVES_STORE_PASSWORD }}
          AVES_KEY_ALIAS: ${{ secrets.AVES_KEY_ALIAS }}
          AVES_KEY_PASSWORD: ${{ secrets.AVES_KEY_PASSWORD }}
          AVES_GOOGLE_API_KEY: ${{ secrets.AVES_GOOGLE_API_KEY }}
        run: ./flutterw build apk --release -t lib/main_play.dart --flavor play --target-platform android-arm64

      - name: Build APK (debug fallback)
        if: steps.key_check.outputs.HAS_KEY != 'true'
        run: ./flutterw build apk --debug -t lib/main_play.dart --flavor play --target-platform android-arm64

      - name: Locate APK
        run: find build/app/outputs -name '*.apk' -type f

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: aves-apk-arm64
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
