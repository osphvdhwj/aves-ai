name: Build debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_debug:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache pub-cache
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Flutter version
        run: ./flutterw --version

      - name: Prepare play flavor
        run: scripts/gen_flavor_play.sh

      - name: Generate app localizations
        run: ./flutterw gen-l10n

      - name: Build debug APK (arm64-v8a only)
        run: ./flutterw build apk --debug -t lib/main_play.dart --flavor play --target-platform android-arm64

      - name: Locate APK
        run: find build/app/outputs -name '*.apk' -type f

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: aves-debug-arm64
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
